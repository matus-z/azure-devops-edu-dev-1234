# =============================================================================
#  Kalkulačka poistenia — pipeline dodávateľa (repozitár `EDU/Dev`)
#
#                          ┌─ 2 · Overenie ────────┐      ┌─ 3 · Balík ─────────────┐
#                          │                       │      │ ┌─────────────────────┐ │
#  ┌─ 1 · Build ──────┐    │                       │  ┌──▶│ │ artefakt `app`      │ │
#  │                  │    │ ┌───────────────────┐ │  │   │ └─────────────────────┘ │
#  │ ┌──────────────┐ │    │ │ Automatické testy │ │  │   └─────────────────────────┘
#  │ │ Zostavenie   │ │    │ └───────────────────┘ │  │
#  │ │ src/ → dist/ │ │───▶│   ‖ súbežne           │──┤
#  │ └──────────────┘ │    │ ┌───────────────────┐ │  │
#  └──────────────────┘    │ │ Statická kontrola │ │  │
#                          │ └───────────────────┘ │  │
#                          │                       │  │   ┌─ 4 · Kontrola verzie ───┐
#                          └───────────────────────┘  │   │ ┌─────────────────────┐ │
#                                                     └──▶│ │ Tag ukazuje na main │ │
#                                                         │ └─────────────────────┘ │
#                                                         └─ len pri tagu v* ───────┘
#
#  Tento súbor patrí dodávateľovi. Účastníci workshopu doň nesiahajú — ale mali
#  by ho vidieť, aby chápali, čo sa deje na druhej strane dodávky: dodávateľ
#  testuje u seba, a až potom vznikne tag, na ktorý sa odkazuje konfiguračný
#  repozitár.
#
#  Dlhšie kroky nie sú inline — sú v `ci/*.ps1`, aby sa dali spustiť a ladiť
#  aj lokálne, mimo pipeline. Inline tu ostávajú len jednoriadkové príkazy.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - 'f*'          # feature vetvy: f1-region, f3-malus, ...
      - 'azure-*'     # Azure testing
  tags:
    include:
      - 'v*'          # tag spustí beh navyše — pozri stage TagGuard

pr:
  branches:
    include:
      - main

pool:
  name: Pool1-Linux

stages:

# -----------------------------------------------------------------------------
# 1. BUILD
# -----------------------------------------------------------------------------
- stage: Build
  displayName: Build
  jobs:
  - job: build
    displayName: Zostavenie aplikácie
    # Agenti v pooli sú vlastné stroje a workspace sa medzi behmi recykluje.
    # Bez tohto by `dist/` ťahal staré súbory z predchádzajúcej verzie.
    workspace:
      clean: all
    steps:

    - checkout: self

    # Node sa tu nepoužíva — Build-Package.ps1 ani Test-FileProtocol.ps1 ho
    # nepotrebujú, preto sa tu nič neinštaluje ani neoveruje.
    - pwsh: ./ci/Build-Package.ps1 -Source src -Destination dist
      displayName: Build — príprava dist/

    # Aplikácia sa musí dať otvoriť dvojklikom — `type="module"` by to rozbilo.
    - pwsh: ./ci/Test-FileProtocol.ps1 -Page dist/index.html
      displayName: Kontrola — otvoriteľnosť z file://

    - publish: dist
      artifact: build-output
      displayName: Odovzdanie buildu ďalším stage

# -----------------------------------------------------------------------------
# 2. VERIFY — dva joby bežia SÚBEŽNE
# -----------------------------------------------------------------------------
- stage: Verify
  displayName: Overenie
  dependsOn: Build
  jobs:

  - job: test
    displayName: Automatické testy
    workspace:
      clean: all
    steps:
    - checkout: self
    # Node je na agentoch nainštalovaný pri príprave stroja — pipeline ho
    # nesťahuje. `NodeTool@0` by ho ťahal z internetu pri každom behu, čo na
    # on-prem agentoch bez konektivity (alebo za TLS proxy) zlyhá.
    - pwsh: ./ci/Test-NodeVersion.ps1 -MinimumMajor 20
      displayName: Kontrola — Node.js na agentovi

    - pwsh: |
        node --test --test-reporter=spec tests/
      displayName: Spustenie testov

    # Ak testy pridáte s výstupom do JUnit XML, výsledky sa zobrazia
    # v záložke Tests namiesto surového logu:
    # - task: PublishTestResults@2
    #   inputs:
    #     testResultsFormat: JUnit
    #     testResultsFiles: 'test-results.xml'
    #   condition: succeededOrFailed()

  - job: lint
    displayName: Statická kontrola
    workspace:
      clean: all
    steps:
    - checkout: self
    # Node je na agentoch nainštalovaný pri príprave stroja — pipeline ho
    # nesťahuje. `NodeTool@0` by ho ťahal z internetu pri každom behu, čo na
    # on-prem agentoch bez konektivity (alebo za TLS proxy) zlyhá.
    - pwsh: ./ci/Test-NodeVersion.ps1 -MinimumMajor 20
      displayName: Kontrola — Node.js na agentovi

    - pwsh: ./ci/Test-JavaScriptSyntax.ps1 -Path src
      displayName: Kontrola syntaxe

# -----------------------------------------------------------------------------
# 3. PACKAGE — overený balík, ktorý si vie stiahnuť aj dodávateľ aj zákazník
# -----------------------------------------------------------------------------
- stage: Package
  displayName: Balík
  dependsOn: Verify
  jobs:
  - job: package
    displayName: Publikovanie overeného balíka
    workspace:
      clean: all
    steps:
    - checkout: none
    - download: current
      artifact: build-output
    - publish: $(Pipeline.Workspace)/build-output
      artifact: app
      displayName: Artefakt `app`

# -----------------------------------------------------------------------------
# 4. VERSION CHECK — beží LEN pri behu spustenom tagom
#
#    Zmyslom je, aby tag nikdy neoznačoval niečo, čo neprešlo `main`.
#    Presne toto je vec, ktorú konfiguračný repozitár nevie overiť — on tagu
#    verí. Tu sa dá overiť.
# -----------------------------------------------------------------------------
- stage: VersionCheck
  displayName: Kontrola verzie
  dependsOn: Verify
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
  jobs:
  - job: versioncheck
    displayName: Tag ukazuje na main
    workspace:
      clean: all
    steps:
    - checkout: self
      fetchDepth: 0          # potrebujeme celú históriu, nie plytký klon

    - pwsh: ./ci/Test-ReleaseTag.ps1 -Tag "$(Build.SourceBranchName)" -Branch main
      displayName: Overenie tagu
