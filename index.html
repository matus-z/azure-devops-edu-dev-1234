<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance Claim Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Insurance Claim Calculator</h1>
      <p class="app__subtitle">
        Enter the claim parameters and calculate the insurance payout.
      </p>
    </header>

    <form id="claim-form" class="card" autocomplete="off">
      <fieldset class="fieldset">
        <legend>Policyholder</legend>

        <div class="field">
          <label for="customerName">Full name</label>
          <input type="text" id="customerName" name="customerName"
                 placeholder="e.g. Jane Doe" />
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="0" max="120"
                 placeholder="e.g. 42" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="CZ">Czech Republic</option>
              <option value="SK">Slovakia</option>
              <option value="DE">Germany</option>
              <option value="AT">Austria</option>
              <option value="PL">Poland</option>
            </select>
          </div>

          <div class="field">
            <label for="region">Region</label>
            <select id="region" name="region">
              <option value="Prague">Prague</option>
              <option value="Brno">Brno</option>
              <option value="Ostrava">Ostrava</option>
              <option value="Plzen">Plzeň</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="fieldset">
        <legend>Claim details</legend>

        <div class="field">
          <label for="damage">Damage amount (CZK)</label>
          <input type="number" id="damage" name="damage" min="0" step="100"
                 placeholder="e.g. 100000" />
        </div>

        <div class="field">
          <label for="deductible">Deductible (CZK)</label>
          <input type="number" id="deductible" name="deductible" min="0" step="100"
                 placeholder="e.g. 5000" />
        </div>

        <div class="field">
          <label for="priorClaims">Number of previous claims</label>
          <input type="number" id="priorClaims" name="priorClaims" min="0" step="1"
                 value="0" placeholder="e.g. 0" />
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn btn--primary">Calculate payout</button>
        <button type="reset" class="btn btn--ghost">Reset</button>
      </div>
    </form>

    <section id="result" class="card result" hidden>
      <h2 class="result__title">Calculation result</h2>
      <p class="result__summary" id="resultSummary"></p>
      <div class="result__amount">
        <span class="result__label">Payout</span>
        <span class="result__value" id="resultValue">0 CZK</span>
      </div>
    </section>
  </main>

  <!-- Core calculation -->
  <script src="calc.js"></script>
  <!-- Hooks attach to the core's finalize step. Load them after calc.js. -->
  <!-- Hook #1 -->
  <!-- Hook #2 -->
  <!-- Hook #3 -->
  <!-- Hook ... -->
  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
