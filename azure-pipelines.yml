# =============================================================================
#  Kalkulačka poistenia — pipeline dodávateľa (repozitár `kalkulacka-dodavatel`)
#
#                          ┌─ 2 · Overenie ────────┐      ┌─ 3 · Balík ─────────────┐
#                          │                       │      │ ┌─────────────────────┐ │
#  ┌─ 1 · Build ──────┐    │                       │  ┌──▶│ │ artefakt `app`      │ │
#  │                  │    │ ┌───────────────────┐ │  │   │ └─────────────────────┘ │
#  │ ┌──────────────┐ │    │ │ Automatické testy │ │  │   └─────────────────────────┘
#  │ │ Zostavenie   │ │    │ └───────────────────┘ │  │
#  │ │ src/ → dist/ │ │───▶│   ‖ súbežne           │──┤
#  │ └──────────────┘ │    │ ┌───────────────────┐ │  │
#  └──────────────────┘    │ │ Statická kontrola │ │  │
#                          │ └───────────────────┘ │  │
#                          │                       │  │   ┌─ 4 · Kontrola verzie ───┐
#                          └───────────────────────┘  │   │ ┌─────────────────────┐ │
#                                                     └──▶│ │ Tag ukazuje na main │ │
#                                                         │ └─────────────────────┘ │
#                                                         └─ len pri tagu v* ───────┘
#
#  Tento súbor patrí dodávateľovi. Účastníci workshopu doň nesiahajú — ale mali
#  by ho vidieť, aby chápali, čo sa deje na druhej strane dodávky: dodávateľ
#  testuje u seba, a až potom vznikne tag, na ktorý sa odkazuje konfiguračný
#  repozitár.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - 'f*'          # feature vetvy: f1-region, f3-malus, ...
  tags:
    include:
      - 'v*'          # tag spustí beh navyše — pozri stage TagGuard

pr:
  branches:
    include:
      - main

pool:
  name: WinAgentPool-Srv2022

stages:

# -----------------------------------------------------------------------------
# 1. BUILD
# -----------------------------------------------------------------------------
- stage: Build
  displayName: Build
  jobs:
  - job: build
    displayName: Zostavenie aplikácie
    steps:

    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: Node.js

    - powershell: |
        # Celá aplikácia leží v `src\` — preto je build obyčajné skopírovanie
        # priečinka. Nový súbor (napr. ďalší hook) sa do balíka dostane sám,
        # bez zásahu do pipeline. `tests\` a `README.md` sú mimo `src\`,
        # takže sa do balíka nedostanú.
        $required = @('src\index.html', 'src\style.css', 'src\calc.js', 'src\app.js')
        $missing  = $required | Where-Object { -not (Test-Path $_) }
        if ($missing) {
          Write-Host "##vso[task.logissue type=error]Chýbajú súbory: $($missing -join ', ')"
          exit 1
        }
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item src\* dist\ -Recurse -Force
        Get-ChildItem dist -Recurse -File | Select-Object FullName
      displayName: Build — príprava dist/

    # Aplikácia sa musí dať otvoriť dvojklikom. Ak sa niekomu podarí pridať
    # `type="module"`, prehliadač ju z `file://` odmietne načítať — a zistíme
    # to až na workshope. Preto to kontrolujeme tu.
    - powershell: |
        if (Select-String -Path dist\index.html -Pattern 'type\s*=\s*"module"' -Quiet) {
          Write-Host "##vso[task.logissue type=error]index.html obsahuje type=module — aplikácia sa neotvorí z file://"
          exit 1
        }
        Write-Host "OK — aplikácia sa dá otvoriť dvojklikom."
      displayName: Kontrola — otvoriteľnosť z file://

    - publish: dist
      artifact: build-output
      displayName: Odovzdanie buildu ďalším stage

# -----------------------------------------------------------------------------
# 2. VERIFY — dva joby bežia SÚBEŽNE
# -----------------------------------------------------------------------------
- stage: Verify
  displayName: Overenie
  dependsOn: Build
  jobs:

  - job: test
    displayName: Automatické testy
    steps:
    - checkout: self
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: Node.js

    - powershell: |
        node --test --test-reporter=spec tests\
      displayName: Spustenie testov

    # Ak testy pridáte s výstupom do JUnit XML, výsledky sa zobrazia
    # v záložke Tests namiesto surového logu:
    # - task: PublishTestResults@2
    #   inputs:
    #     testResultsFormat: JUnit
    #     testResultsFiles: 'test-results.xml'
    #   condition: succeededOrFailed()

  - job: lint
    displayName: Statická kontrola
    steps:
    - checkout: self
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
      displayName: Node.js

    - powershell: |
        # Syntaktická kontrola bez spustenia — zachytí preklep, ktorý by
        # inak spadol až v prehliadači.
        $scripts = Get-ChildItem src -Recurse -Filter *.js | ForEach-Object { $_.FullName }
        foreach ($s in $scripts) {
          node --check $s
          if ($LASTEXITCODE -ne 0) {
            Write-Host "##vso[task.logissue type=error]$s má syntaktickú chybu"
            exit 1
          }
        }
        Write-Host "OK — všetky skripty sú syntakticky v poriadku."
      displayName: Kontrola syntaxe

# -----------------------------------------------------------------------------
# 3. PACKAGE — overený balík, ktorý si vie stiahnuť aj dodávateľ aj zákazník
# -----------------------------------------------------------------------------
- stage: Package
  displayName: Balík
  dependsOn: Verify
  jobs:
  - job: package
    displayName: Publikovanie overeného balíka
    steps:
    - checkout: none
    - download: current
      artifact: build-output
    - publish: $(Pipeline.Workspace)/build-output
      artifact: app
      displayName: Artefakt `app`

# -----------------------------------------------------------------------------
# 4. VERSION CHECK — beží LEN pri behu spustenom tagom
#
#    Zmyslom je, aby tag nikdy neoznačoval niečo, čo neprešlo `main`.
#    Presne toto je vec, ktorú konfiguračný repozitár nevie overiť — on tagu
#    verí. Tu sa dá overiť.
# -----------------------------------------------------------------------------
- stage: VersionCheck
  displayName: Kontrola verzie
  dependsOn: Verify
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
  jobs:
  - job: versioncheck
    displayName: Tag ukazuje na main
    steps:
    - checkout: self
      fetchDepth: 0          # potrebujeme celú históriu, nie plytký klon

    - powershell: |
        $tag = "$(Build.SourceBranchName)"
        Write-Host "Kontrolujem tag: $tag"

        # Formát verzie
        if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
          Write-Host "##vso[task.logissue type=error]Tag '$tag' nemá tvar vX.Y.Z"
          exit 1
        }

        # Tag musí ukazovať na commit, ktorý je v main
        git fetch origin main --quiet
        $sha = git rev-list -n 1 $tag
        git merge-base --is-ancestor $sha origin/main
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##vso[task.logissue type=error]Tag '$tag' neukazuje na commit v main"
          exit 1
        }

        Write-Host "OK — $tag ukazuje na $sha, ktorý je v main."
      displayName: Overenie tagu
